<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  body { max-width: 30rem; margin: 4rem auto; padding: 1rem; font: 1.25rem system-ui; }
  input, select, button { width: 100%; box-sizing: border-box; margin: .25rem 0; padding: .75rem; font: inherit; }
  output { display: block; margin-top: 1rem; font-size: 2rem; }
</style>
<h1>Calculator</h1>
<form>
  <input id="first" type="number" value="0" aria-label="First number">
  <select id="operator" aria-label="Operation">
    <option>+</option>
    <option>−</option>
    <option>×</option>
    <option>÷</option>
  </select>
  <input id="second" type="number" value="0" aria-label="Second number">
  <button>Calculate</button>
  <output id="result">0</output>
</form>
<script>
  const calculate = {
    "+": (a, b) => a + b,
    "−": (a, b) => a - b,
    "×": (a, b) => a * b,
    "÷": (a, b) => a / b
  }
  document.querySelector("form").onsubmit = event => {
    event.preventDefault()
    result.value = calculate[operator.value](Number(first.value), Number(second.value))
  }
</script>
